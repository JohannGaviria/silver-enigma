services:

  test-postgres:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT}:5432"
    env_file:
      - ./.env.test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  test-redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    env_file:
      - ./.env.test
    command: redis-server --requirepass $REDIS_PASSWORD
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test-postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_silver_enigma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test-postgres -d test_silver_enigma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 15s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a password ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
          --health-start-period 5s
        command: redis-server --requirepass password

    env:
      DATABASE_URL: postgresql+asyncpg://test-postgres:password@localhost:5432/test_silver_enigma

      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root

      - name: Check code quality
        run: make check

      - name: Run tests with coverage
        run: |
          poetry run pytest tests/e2e/modules/auth/api/routes/test_user_authentication_router.py -vv -s
          poetry run pytest tests/integration/shared/infrastructure/outbound/test_redis_cache_outbound_adapter.py -vv -s
